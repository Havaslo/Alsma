<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Проверка доступа VK — АЛСМА</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #20332b;
        background: #f6f8f6;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        max-width: 560px;
        margin: 24px auto;
        padding: 28px;
        background: white;
        border: 1px solid #e0e8e1;
        border-radius: 16px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 14px;
      }
      p {
        line-height: 1.55;
      }
      button {
        background: #155d44;
        color: white;
        border: 0;
        border-radius: 8px;
        padding: 13px 18px;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #status {
        white-space: pre-line;
        padding: 14px;
        background: #f2f6f3;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Проверка доступа к фото VK</h1>
      <p>
        Тестируем группу Black Turtle (ID 138003065). Посты и фотографии не
        публикуются.
      </p>
      <p>
        VK попросит разрешить доступ к фотографиям. Ключ остаётся в памяти этой
        страницы, мы его не сохраняем.
      </p>
      <button id="check" type="button" disabled>Проверить доступ</button>
      <p id="status" role="status" aria-live="polite">
        Подготавливаем проверку…
      </p>
    </main>
    <script type="module" src="/src/devtools/vkPhotoProbe.ts"></script>
  </body>
</html>
